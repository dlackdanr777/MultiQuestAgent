plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'tdg.oculuswirelessadb'
    compileSdk 35

    defaultConfig {
        applicationId "tdg.MultiquestAgent"
        minSdk 29
        targetSdk 34

        // 버전 정보
        versionCode 49
        versionName "0.1.48"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // [추가] 빌드 완료 후 APK 파일명을 "MultiquestAgent"로 자동 변경
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            // 결과 파일명을 MultiquestAgent_release_v0.1.0.apk 형태로 지정
            outputFileName = "MultiquestAgent_${variant.name}_v${variant.versionName}.apk"
        }
    }

    // 서명 오류 해결 (C드라이브 경로 에러 방지)
    signingConfigs {
        debug {
            // 기본 디버그 키를 사용합니다.
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // 릴리스 빌드에서도 디버그 서명을 사용하여 서명 오류 우회
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // 기존 기능 유지용 라이브러리
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jmdns:jmdns:3.5.8'
}